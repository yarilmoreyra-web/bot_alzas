name: Consulta de alzas

on:
  workflow_dispatch:
    inputs:
      minutos:
        description: "Minutos hacia atras para comparar"
        default: "15"
      volumen_minimo:
        description: "Volumen minimo negociado en ese intervalo"
        default: "10000"

jobs:
  consulta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install longbridge pytz requests

      - name: Ejecutar consulta
        run: python consulta.py
        env:
          LONGBRIDGE_APP_KEY: ${{ secrets.LONGBRIDGE_APP_KEY }}
          LONGBRIDGE_APP_SECRET: ${{ secrets.LONGBRIDGE_APP_SECRET }}
          LONGBRIDGE_ACCESS_TOKEN: ${{ secrets.LONGBRIDGE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MINUTOS: ${{ github.event.inputs.minutos }}
          VOLUMEN_MINIMO: ${{ github.event.inputs.volumen_minimo }}
